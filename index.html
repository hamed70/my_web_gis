<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web GIS - Field Notes</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1>🗺️ Field Notes</h1>
                <p class="subtitle">Click the map to add markers</p>
            </div>

            <div class="sidebar-actions">
                <button id="btn-geolocate" class="btn btn-primary" title="Find my location">
                    <span class="btn-icon">📍</span> My Location
                </button>
                <button id="btn-export" class="btn btn-success" title="Export as GeoJSON">
                    <span class="btn-icon">💾</span> Export GeoJSON
                </button>
                <label class="btn btn-info import-label" title="Import GeoJSON file">
                    <span class="btn-icon">📂</span> Import GeoJSON
                    <input type="file" id="btn-import" accept=".geojson,.json" hidden>
                </label>
                <button id="btn-clear-all" class="btn btn-danger" title="Remove all markers">
                    <span class="btn-icon">🗑️</span> Clear All
                </button>
            </div>

            <div class="sidebar-stats">
                <span id="marker-count">0</span> marker(s) saved
            </div>

            <div id="marker-list" class="marker-list">
                <p class="empty-message">No markers yet. Click on the map to add one!</p>
            </div>
        </aside>

        <!-- Map Container -->
        <div id="map-container">
            <div id="map"></div>
            <div id="coordinates-display" class="map-overlay">
                Lat: <span id="coord-lat">--</span>, Lng: <span id="coord-lng">--</span>
            </div>
        </div>
    </div>

    <!-- Popup Template (used by MapLibre) -->
    <div id="popup-template" style="display:none;">
        <div class="popup-content">
            <div class="popup-header">
                <strong class="popup-title">📌 Marker</strong>
                <button class="popup-delete-btn" title="Delete marker">✕</button>
            </div>
            <div class="popup-date"></div>
            <div class="popup-coords"></div>
            <textarea class="popup-notes" placeholder="Write your notes here..." rows="4"></textarea>
            <button class="popup-save-btn btn btn-primary btn-sm">Save Notes</button>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="app.js"></script>
</body>
</html>
