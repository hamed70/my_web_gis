<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یادداشت میدانی | نقشه مشهد</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1><span class="logo-mark">◈</span> یادداشت میدانی</h1>
                <p class="subtitle">روی نقشه کلیک کنید تا یک نقطه ثبت شود</p>
            </div>

            <div class="sidebar-scroll">

                <div class="sidebar-section sidebar-actions">
                    <button id="btn-geolocate" class="btn btn-primary" title="یافتن موقعیت من">
                        <span class="btn-icon">◎</span> موقعیت من
                    </button>
                    <button id="btn-export" class="btn btn-success" title="خروجی GeoJSON">
                        <span class="btn-icon">⇩</span> خروجی GeoJSON
                    </button>
                    <label class="btn btn-teal import-label" title="ورودی GeoJSON">
                        <span class="btn-icon">⇧</span> ورودی GeoJSON
                        <input type="file" id="btn-import" accept=".geojson,.json" hidden>
                    </label>
                    <button id="btn-clear-all" class="btn btn-danger" title="حذف همه نقاط">
                        <span class="btn-icon">⨯</span> پاک کردن همه
                    </button>
                </div>

                <div class="sidebar-section layers-section">
                    <div class="section-title">
                        <span>لایه‌ها</span>
                        <span class="section-hint">برای فعال‌سازی، روی لایه بزنید</span>
                    </div>
                    <div id="layers-list" class="layers-list"></div>

                    <div id="add-layer-form" class="add-layer-form" hidden>
                        <input type="text" id="new-layer-name" class="layer-input" placeholder="نام لایه، مثلاً «خانواده»" maxlength="24">
                        <input type="color" id="new-layer-color" class="layer-color-input" value="#79c26f" title="رنگ لایه">
                        <div class="add-layer-buttons">
                            <button id="confirm-add-layer" class="btn btn-primary btn-sm">افزودن</button>
                            <button id="cancel-add-layer" class="btn btn-ghost btn-sm">انصراف</button>
                        </div>
                    </div>
                    <button id="btn-add-layer" class="btn btn-outline btn-sm btn-full">+ لایه جدید</button>
                </div>

                <div class="sidebar-stats">
                    <span id="marker-count">0</span> نقطه ثبت شده
                </div>

                <div id="marker-list" class="marker-list">
                    <p class="empty-message">هنوز نقطه‌ای ثبت نشده. روی نقشه کلیک کنید تا یک نقطه اضافه کنید!</p>
                </div>
            </div>
        </aside>

        <!-- Map Container -->
        <div id="map-container">
            <div id="map"></div>
            <div id="coordinates-display" class="map-overlay">
                <span class="coord-label">Lat</span> <span id="coord-lat">--</span>
                <span class="coord-sep">/</span>
                <span class="coord-label">Lng</span> <span id="coord-lng">--</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="app.js"></script>
</body>
</html>
